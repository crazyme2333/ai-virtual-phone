name: Sync Upstream Test Branch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Force Sync Test Branch from Upstream
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream https://github.com/xiaolongbao0709/ai-virtual-phone.git
          git fetch upstream test
          git checkout -B test upstream/test
          git push -f origin test
